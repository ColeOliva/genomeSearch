name: .NET CI

on:
  push:
    branches: [main]
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore GenomeSearch.sln

      - name: Build
        run: dotnet build GenomeSearch.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GenomeSearch.Api.Tests/GenomeSearch.Api.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: dotnet/GenomeSearch.Api.Tests/TestResults/*.trx
          if-no-files-found: ignore
